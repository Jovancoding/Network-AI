name: HOL Plugin Security Scan

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: HOL plugin-scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Same gate as the awesome-ai-plugins central scan (repo policy not trusted).
      - name: Run HOL plugin-scanner
        uses: hashgraph-online/ai-plugin-scanner-action@a4705d710505d3e8f6d639b683a0c87dd31ce598  # v1.2.748
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
          trust_repository_policy: "false"
          online: "false"
          upload_sarif: "false"
          pr_comment: "off"
